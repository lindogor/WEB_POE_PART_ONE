<g>
  <rect x="530" y="150" width="140" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
  <text x="600" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#04342C">Contact</text>
  <text x="600" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">contact.html</text>
