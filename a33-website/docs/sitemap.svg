<text x="340" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3A342F">Global navigation links every page to the other four.</text>
<text x="340" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3A342F">Root folder also contains /css, /js and /images subfolders.</text>
